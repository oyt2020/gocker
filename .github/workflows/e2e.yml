name: runtime-e2e

on:
  push:
    branches: [phase2]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ALPINE_URL: https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.3-x86_64.tar.gz
      RUNC_VERSION: v1.2.5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 1. 환경 준비: runc(버전 고정) + alpine rootfs (assets/는 .gitignore 대상이라 CI에서 다운로드)
      - name: Install runc
        run: |
          sudo curl -fsSL -o /usr/local/bin/runc \
            "https://github.com/opencontainers/runc/releases/download/${RUNC_VERSION}/runc.amd64"
          sudo chmod +x /usr/local/bin/runc
          sudo runc --version

      - name: Prepare alpine rootfs
        run: |
          mkdir -p assets
          curl -fsSL -o assets/alpine-minirootfs.tar.gz "$ALPINE_URL"

      # 2. 빌드
      - name: Build
        run: go build -o gocker .

      # 3, 4. 라이프사이클 명령 순차 실행 (실패해도 끝까지 실행, 마지막에 실패 목록 출력)
      - name: Runtime lifecycle E2E
        run: sudo bash scripts/e2e.sh
